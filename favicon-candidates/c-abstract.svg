<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="32" fill="#ffffff"/>
  <g stroke="#16365c" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- chevron plane, nose pointing down-right (oblique) -->
