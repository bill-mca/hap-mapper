<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hap-Map · Exploring Australia's historical aerial photography</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exploring Australia's historical aerial photography">

    <!-- Fetched at once, before the script has even arrived; the script
         picks them up from the preload cache. -->
    <link rel="preload" href="/site.json" as="fetch" crossorigin>
    <link rel="preload" href="/web-items.json" as="fetch" crossorigin>

    <!-- The map: MapLibre GL JS, which renders rasters on the GPU and so
         crossfades them smoothly, with every historical layer a Web
         Mercator COG drawn by src/cog.js. Vite bundles it all. -->
    <script type="module" src="/src/main.js"></script>

    <style type="text/css">
        :root {
            --hap-navy: #16365c;
            --hap-accent: #e6198a; /* magenta */
            --hap-charcoal: #2a2c2e; /* NO_DATA in src/main.js */
            --hap-charcoal-light: #3a3d41;
            --hap-ink-light: #d5d8dc;
            --hap-ink-muted: #9aa0a7;
            --timeline-width: 86px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
        }

        #map {
            background: var(--hap-charcoal);
        }

        /* ---- Search, at the top centre of the map ---- */
        #search {
            position: absolute;
            top: 10px;
            left: 54px;
            right: calc(var(--timeline-width) + 10px);
            z-index: 5;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        #search .maplibregl-ctrl-geocoder {
            pointer-events: auto;
            width: 240px;
            min-width: 0;
            max-width: 100%;
            font-size: 13px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        /* The plugin draws its own clear button */
        #search input::-webkit-search-cancel-button {
            -webkit-appearance: none;
        }

        /* ---- Timeline (right edge, topotijdreis style) ---- */
        #timeline {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--timeline-width);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--hap-charcoal);
            border-left: 1px solid var(--hap-charcoal-light);
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.4);
            user-select: none;
            -webkit-user-select: none;
        }

        #play-btn {
            margin: 12px 0 8px;
            width: 44px;
            height: 44px;
            border: 2px solid var(--hap-accent);
            border-radius: 50%;
            background: transparent;
            color: var(--hap-accent);
            font-size: 16px;
            cursor: pointer;
            flex: none;
        }

        #play-btn:hover {
            background: var(--hap-accent);
            color: #fff;
        }

        #track {
            position: relative;
            flex: 1;
            width: 100%;
            margin-bottom: 18px;
            cursor: pointer;
            touch-action: none;
        }

        /* Central vertical line of the timeline */
        #track::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            margin-left: -1px;
            background: var(--hap-charcoal-light);
        }

        .tick {
            position: absolute;
            left: 50%;
            height: 1px;
            background: #55595e;
            transform: translateX(-50%);
            width: 10px;
        }

        .tick.decade {
            width: 18px;
            height: 2px;
            background: #7d838a;
        }

        .tick-label {
            position: absolute;
            left: 6px;
            transform: translateY(-50%);
            font-size: 10px;
            color: var(--hap-ink-muted);
        }

        /* Dots marking years with available imagery */
        .year-dot {
            position: absolute;
            left: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--hap-accent);
            border: 2px solid var(--hap-charcoal);
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 2;
        }

        .year-dot[hidden] {
            display: none;
        }

        /* A year whose sharpest imagery in view is coarser than the screen */
        .year-dot.coarse {
            background: #6e737a;
        }

        /* Draggable year handle */
        #handle {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--hap-accent);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            cursor: grab;
            white-space: nowrap;
            z-index: 3;
            transition: top 0.25s ease;
        }

        #handle.dragging {
            cursor: grabbing;
            transition: none;
            transform: translate(-50%, -50%) scale(1.12);
        }

        /* Zoomed in past what the photographs on screen can show */
        #handle.coarse {
            background: #6e737a;
        }

        /* ---- Click popup: which photograph this spot came from ---- */
        .maplibregl-popup-content {
            font-size: 13px;
            line-height: 1.45;
            color: #1d2733;
            padding: 10px 14px;
            max-width: 300px;
        }

        .frame-pop h4 {
            margin: 0 0 4px;
            font-size: 14px;
            color: var(--hap-navy);
        }

        .frame-pop p {
            margin: 4px 0;
        }

        .frame-pop .muted {
            color: #54657c;
        }

        .frame-pop .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .frame-pop button,
        .frame-pop a.btn {
            border: 1px solid var(--hap-navy);
            background: #fff;
            color: var(--hap-navy);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .frame-pop button:hover,
        .frame-pop a.btn:hover,
        .frame-pop button[aria-pressed="true"] {
            background: var(--hap-navy);
            color: #fff;
        }

        /* ---- The photograph ---- */
        #photo {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(11, 22, 34, 0.86);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #photo[hidden] {
            display: none;
        }

        #photo figure {
            margin: 0;
            background: #fff;
            border-radius: 6px;
            padding: 10px 12px 12px;
            max-width: min(96vw, 900px);
            max-height: 94vh;
            display: flex;
            flex-direction: column;
            font-size: 13px;
            color: #1d2733;
        }

        #photo header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }

        #photo-close {
            border: none;
            background: none;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: #54657c;
        }

        #photo .frame {
            min-height: 0;
            flex: 1;
            display: flex;
            justify-content: center;
        }

        #photo img {
            display: block;
            max-width: 100%;
            max-height: calc(94vh - 120px);
            object-fit: contain;
            cursor: zoom-in;
        }

        #photo figcaption {
            margin-top: 8px;
        }

        /* ---- Spinner: centred on the map, shown only while data loads ---- */
        #spinner {
            position: absolute;
            top: 50%;
            left: calc((100% - var(--timeline-width)) / 2);
            z-index: 30;
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            box-sizing: border-box;
            border: 4px solid rgba(255, 255, 255, 0.55);
            border-top-color: var(--hap-accent);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            animation: spin 0.9s linear infinite;
        }

        #spinner[hidden] {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #spinner {
                animation-duration: 3s;
            }
        }

        /* ---- The labels button, with MapLibre's zoom buttons ---- */
        .maplibregl-ctrl-group button.labels-btn {
            font: 600 13px/1 Georgia, serif;
            color: #333;
        }

        .maplibregl-ctrl-group button.labels-btn[aria-pressed="false"] {
            color: #999;
            text-decoration: line-through;
        }

        /* ---- Attribution: only what is on screen ---- */
        #attribution {
            position: absolute;
            bottom: 0;
            right: var(--timeline-width);
            z-index: 4;
            max-width: calc(100vw - var(--timeline-width));
            box-sizing: border-box;
            padding: 2px 8px;
            border-top-left-radius: 4px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--hap-ink-light);
            background: rgba(42, 44, 46, 0.85);
        }

        #attribution a {
            color: inherit;
        }

        @media (max-width: 600px) {
            :root {
                --timeline-width: 64px;
            }

            /* "1974–75" must fit the narrower timeline */
            #handle {
                font-size: 12px;
                padding: 5px 6px;
            }
        }
    </style>
</head>

<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Search for a present-day place -->
    <div id="search"></div>

    <!-- Spins while the map or the page is fetching data -->
    <div id="spinner" role="status" aria-label="Loading" hidden></div>

    <!-- Credits for what is on screen -->
    <div id="attribution"></div>

    <!-- A photograph, opened from the click popup -->
    <div id="photo" hidden role="dialog" aria-modal="true" aria-labelledby="photo-title">
        <figure>
            <header>
                <strong id="photo-title"></strong>
                <button id="photo-close" type="button" aria-label="Close">&times;</button>
            </header>
            <div class="frame">
                <a id="photo-link" target="_blank" rel="noopener" title="Open the photograph in a new tab"><img id="photo-img" alt=""></a>
            </div>
            <figcaption id="photo-caption"></figcaption>
        </figure>
    </div>

    <!-- Timeline (topotijdreis-style year slider) -->
    <div id="timeline">
        <button id="play-btn" title="Play through the years" aria-label="Play through the years">&#9654;</button>
        <div id="track">
            <div id="handle">2025</div>
        </div>
    </div>

</body>
</html>
