<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hap-Map - Time travel over North Canberra</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- MapLibre GL CSS/JS. MapLibre is a WebGL map engine; unlike Leaflet it
         renders rasters on the GPU, which lets the 1955 Cloud-Optimized GeoTIFF
         be reprojected (UTM 55S -> Web Mercator) on the fly without choking the
         main thread, and gives smooth raster-opacity crossfades for free. -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

    <style type="text/css">
        :root {
            --hap-navy: #16365c;
            --hap-navy-light: #1f4d83;
            --hap-accent: #f5a623;
            --timeline-width: 86px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
        }

        #map {
            background: #0b1622;
        }

        /* ---- Title card (top left, under the nav controls) ---- */
        #title-card {
            position: absolute;
            top: 10px;
            left: 54px;
            z-index: 5;
            background: var(--hap-navy);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        #title-card h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        #title-card p {
            margin: 2px 0 0;
            font-size: 11px;
            opacity: 0.8;
        }

        /* ---- Timeline (right edge, topotijdreis style) ---- */
        #timeline {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--timeline-width);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.25);
            user-select: none;
            -webkit-user-select: none;
        }

        #play-btn {
            margin: 12px 0 8px;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--hap-navy);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            flex: none;
        }

        #play-btn:hover {
            background: var(--hap-navy-light);
        }

        #track {
            position: relative;
            flex: 1;
            width: 100%;
            margin-bottom: 18px;
            cursor: pointer;
            touch-action: none;
        }

        /* Central vertical line of the timeline */
        #track::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            margin-left: -1px;
            background: #c3cbd6;
        }

        .tick {
            position: absolute;
            left: 50%;
            height: 1px;
            background: #aab4c2;
            transform: translateX(-50%);
            width: 10px;
        }

        .tick.decade {
            width: 18px;
            height: 2px;
            background: #6e7c8e;
        }

        .tick-label {
            position: absolute;
            left: 6px;
            transform: translateY(-50%);
            font-size: 10px;
            color: #54657c;
        }

        /* Dots marking years with available imagery */
        .year-dot {
            position: absolute;
            left: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--hap-accent);
            border: 2px solid #fff;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.4);
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 2;
        }

        /* Draggable year handle */
        #handle {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--hap-navy);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
            cursor: grab;
            z-index: 3;
            transition: top 0.25s ease;
        }

        #handle.dragging {
            cursor: grabbing;
            transition: none;
            transform: translate(-50%, -50%) scale(1.12);
        }

        /* Keep MapLibre attribution clear of the timeline */
        .maplibregl-ctrl-bottom-right {
            right: var(--timeline-width);
        }

        @media (max-width: 600px) {
            :root {
                --timeline-width: 64px;
            }

            #title-card h1 {
                font-size: 13px;
            }

            #title-card p {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Title card -->
    <div id="title-card">
        <h1>Hap-Map</h1>
        <p>Time travel over North Canberra</p>
    </div>

    <!-- Timeline (topotijdreis-style year slider) -->
    <div id="timeline">
        <button id="play-btn" title="Play through the years" aria-label="Play through the years">&#9654;</button>
        <div id="track">
            <div id="handle">1955</div>
        </div>
    </div>

    <script type="module">
        // The COG protocol is ESM; esm.sh resolves its bundled deps (geotiff,
        // d3-scale, sphericalmercator) into a browser-ready module so the site
        // keeps its no-build-step setup.
        import { cogProtocol, setColorFunction }
            from 'https://esm.sh/@geomatico/maplibre-cog-protocol@0.9.0';

        // Teach MapLibre how to fetch `cog://` raster tiles.
        maplibregl.addProtocol('cog', cogProtocol);

        // ------------------------------------------------------------------
        // Map setup. MapLibre zoom is ~1 level "tighter" than Leaflet's, so
        // zoom 16 here matches the old Leaflet view at zoom 17.
        // ------------------------------------------------------------------
        var canberraMap = new maplibregl.Map({
            container: 'map',
            center: [149.119, -35.2826],
            zoom: 16,
            maxZoom: 21,
            attributionControl: false,
            style: {
                version: 8,
                sources: {},
                layers: [
                    { id: 'background', type: 'background', paint: { 'background-color': '#0b1622' } }
                ]
            }
        });

        canberraMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
        canberraMap.addControl(new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            fitBoundsOptions: { maxZoom: 15 }
        }), 'top-left');
        canberraMap.addControl(new maplibregl.AttributionControl({ compact: false }), 'bottom-right');

        // ------------------------------------------------------------------
        // Imagery years. To add a new year of HAP imagery, append an entry
        // here (keep the list sorted oldest -> newest). The newest year is the
        // always-visible base layer; older years crossfade on top of it.
        // ------------------------------------------------------------------
        // Same-origin: this Worker range-proxies the COG out of R2 (see
        // worker/cog-proxy.js), returning proper 206s that Cloudflare's 512 MB
        // cache limit would otherwise deny for a 2.3 GB object on a custom
        // domain. The COG is reprojected to EPSG:3857 — maplibre-cog-protocol
        // only renders Web Mercator COGs, not the source UTM 55S.
        var COG_1955 = location.origin + '/cog/north-canberra-1955-odm-3857.tif';

        // The 1955 COG is panchromatic with two bands: band 1 = luminance,
        // band 2 = alpha mask. Paint it grey, honouring the alpha so the
        // mosaic's ragged edges stay transparent. Runs once per pixel — fast.
        setColorFunction(COG_1955, function (pixel, color, metadata) {
            var lum = pixel[0];
            var alpha = pixel[1];
            if (alpha === 0 || lum === metadata.noData || lum === null || isNaN(lum)) {
                color.set([0, 0, 0, 0]);
            } else {
                color.set([lum, lum, lum, alpha === undefined ? 255 : alpha]);
            }
        });

        var IMAGERY_YEARS = [
            {
                year: 1955,
                layerId: 'imagery-1955',
                addSource: function (map) {
                    map.addSource('imagery-1955', {
                        type: 'raster',
                        url: 'cog://' + COG_1955,
                        tileSize: 256,
                        attribution: '&copy; cc-by Image data derived from Geoscience Australia\'s <a href="https://www.ga.gov.au/scientific-topics/national-location-information/historical-aerial-photography">historical aerial photography collection</a>'
                    });
                }
            },
            {
                year: 2025,
                layerId: 'imagery-2025',
                addSource: function (map) {
                    map.addSource('imagery-2025', {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        maxzoom: 19,
                        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
                    });
                }
            }
        ];

        var BASE = IMAGERY_YEARS[IMAGERY_YEARS.length - 1]; // newest year

        // Add the base layer first (bottom of the stack), then the older years
        // above it so they can fade in/out over the base. Each older raster
        // layer starts fully transparent.
        canberraMap.on('load', function () {
            BASE.addSource(canberraMap);
            canberraMap.addLayer({
                id: BASE.layerId,
                type: 'raster',
                source: BASE.layerId,
                paint: { 'raster-opacity': 1 }
            });

            IMAGERY_YEARS.forEach(function (entry) {
                if (entry === BASE) return;
                entry.addSource(canberraMap);
                canberraMap.addLayer({
                    id: entry.layerId,
                    type: 'raster',
                    source: entry.layerId,
                    paint: {
                        'raster-opacity': 0,
                        'raster-opacity-transition': { duration: 800, delay: 0 }
                    }
                });
            });

            // Start on the oldest imagery so the "time travel" is obvious.
            setYear(IMAGERY_YEARS[0].year);
        });

        // ------------------------------------------------------------------
        // Timeline
        // ------------------------------------------------------------------
        var TIMELINE_MIN = 1950;
        var TIMELINE_MAX = 2030;

        var track = document.getElementById('track');
        var handle = document.getElementById('handle');
        var playBtn = document.getElementById('play-btn');

        var activeYear = BASE.year;

        // Year <-> vertical position (newest at the top, like topotijdreis)
        function yearToPercent(year) {
            return (TIMELINE_MAX - year) / (TIMELINE_MAX - TIMELINE_MIN) * 100;
        }

        function offsetToYear(offsetY) {
            var rect = track.getBoundingClientRect();
            var fraction = Math.min(1, Math.max(0, (offsetY - rect.top) / rect.height));
            return TIMELINE_MAX - fraction * (TIMELINE_MAX - TIMELINE_MIN);
        }

        function nearestImageryYear(year) {
            var best = IMAGERY_YEARS[0];
            IMAGERY_YEARS.forEach(function (entry) {
                if (Math.abs(entry.year - year) < Math.abs(best.year - year)) {
                    best = entry;
                }
            });
            return best.year;
        }

        // Build tick marks (yearly minor ticks, labelled decade ticks)
        for (var y = TIMELINE_MIN; y <= TIMELINE_MAX; y++) {
            var tick = document.createElement('div');
            tick.className = 'tick' + (y % 10 === 0 ? ' decade' : '');
            tick.style.top = yearToPercent(y) + '%';
            track.appendChild(tick);

            if (y % 10 === 0) {
                var label = document.createElement('div');
                label.className = 'tick-label';
                label.textContent = y;
                label.style.top = yearToPercent(y) + '%';
                track.appendChild(label);
            }
        }

        // Dots for years with available imagery
        IMAGERY_YEARS.forEach(function (entry) {
            var dot = document.createElement('div');
            dot.className = 'year-dot';
            dot.title = String(entry.year);
            dot.style.top = yearToPercent(entry.year) + '%';
            dot.addEventListener('click', function (e) {
                e.stopPropagation();
                setYear(entry.year);
            });
            track.appendChild(dot);
        });

        function updateHandle(year) {
            handle.style.top = yearToPercent(year) + '%';
            handle.textContent = Math.round(year);
        }

        // Switch the visible imagery by fading raster layers. The base (newest)
        // year always stays fully opaque underneath.
        function applyImagery(year) {
            if (!canberraMap.isStyleLoaded()) return;
            IMAGERY_YEARS.forEach(function (entry) {
                if (entry === BASE) return;
                canberraMap.setPaintProperty(
                    entry.layerId, 'raster-opacity', (entry.year === year) ? 1 : 0);
            });
        }

        function setYear(year) {
            activeYear = nearestImageryYear(year);
            applyImagery(activeYear);
            updateHandle(activeYear);
        }

        // Dragging: handle follows the pointer, imagery switches to the
        // nearest available year live, and the handle snaps on release.
        var dragging = false;

        function onPointerMove(e) {
            if (!dragging) return;
            var year = offsetToYear(e.clientY);
            updateHandle(year);
            var nearest = nearestImageryYear(year);
            if (nearest !== activeYear) {
                activeYear = nearest;
                applyImagery(activeYear);
            }
        }

        function onPointerUp() {
            if (!dragging) return;
            dragging = false;
            handle.classList.remove('dragging');
            setYear(activeYear);
        }

        track.addEventListener('pointerdown', function (e) {
            stopPlayback();
            dragging = true;
            handle.classList.add('dragging');
            track.setPointerCapture(e.pointerId);
            onPointerMove(e);
        });
        track.addEventListener('pointermove', onPointerMove);
        track.addEventListener('pointerup', onPointerUp);
        track.addEventListener('pointercancel', onPointerUp);

        // Keyboard: step between available imagery years
        document.addEventListener('keydown', function (e) {
            var idx = IMAGERY_YEARS.findIndex(function (entry) {
                return entry.year === activeYear;
            });
            if (e.key === 'ArrowUp' && idx < IMAGERY_YEARS.length - 1) {
                setYear(IMAGERY_YEARS[idx + 1].year);
            } else if (e.key === 'ArrowDown' && idx > 0) {
                setYear(IMAGERY_YEARS[idx - 1].year);
            }
        });

        // ------------------------------------------------------------------
        // Playback: animate through the available years
        // ------------------------------------------------------------------
        var playTimer = null;

        function stopPlayback() {
            if (playTimer !== null) {
                clearInterval(playTimer);
                playTimer = null;
                playBtn.innerHTML = '&#9654;';
                playBtn.title = 'Play through the years';
            }
        }

        playBtn.addEventListener('click', function () {
            if (playTimer !== null) {
                stopPlayback();
                return;
            }
            playBtn.innerHTML = '&#10074;&#10074;';
            playBtn.title = 'Pause';
            // Start from the oldest year, then step forward on each tick
            setYear(IMAGERY_YEARS[0].year);
            playTimer = setInterval(function () {
                var idx = IMAGERY_YEARS.findIndex(function (entry) {
                    return entry.year === activeYear;
                });
                var next = (idx + 1) % IMAGERY_YEARS.length;
                setYear(IMAGERY_YEARS[next].year);
            }, 2500);
        });

        // Reflect the starting handle position before the map finishes loading.
        updateHandle(IMAGERY_YEARS[0].year);
    </script>
</body>
</html>
