# The imagery hapmap.app shows, oldest first.
#
# Each layer is a STAC item in the hap-mosaics catalog (claude-agent/hap-mosaics
# on Gitea), named by its ID. Everything else about it comes from the catalog:
# its R2 key, whether it is grey or colour, its flight dates, which give the
# timeline year and label (1974–75 is worked out, not written down), and, for
# a Blag Map mosaic, which photograph made each pixel.
#
# This file is what differs between the production site (the `main` branch,
# deployed to the `hapmap` Worker) and the dev site (the `dev` branch, deployed
# to `hapmap-dev`). Facts about a mosaic never differ, so they stay in the
# catalog. An item must be published to R2 (hap-mosaics' publish.py) before a
# branch can show it.
#
# A layer may be written as just its ID, or as {item: ID, label: "..."} to
# override the label worked out from its dates.

layers:
  - canberra-1926-map3584-blag-3857
  - act-1944-map658-753-blag-3857
  - canberra-1945-map1537-blag-3857
  - north-canberra-1955-cac80-3857
  - act-1968-cacc4-c15-blag-3857
  - act-1974-75-cas896-920-blag-3857
  - canberra-1980-soc276-279-blag-3857

# The present day, always drawn underneath; not in the catalog.
base:
  year: 2025
  title: Esri World Imagery
  description: Present-day satellite and aerial imagery from Esri's World Imagery basemap.
  tiles: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
  tileSize: 256
  maxzoom: 19
  attribution: "Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community"
